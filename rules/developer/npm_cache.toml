id = "npm_cache"
name = "npm Download Cache"
category = "developer"
description = "Cached npm downloads. Select if you can download dependencies again."
safety = "Review"

[[targets]]
action = "DeleteContents"
allowed_root = '%LOCALAPPDATA%\npm-cache'
path = '%LOCALAPPDATA%\npm-cache\_cacache'

[requirements]
process_closed = "node.exe, npm.exe"
