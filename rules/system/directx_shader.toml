id = "directx_shader"
name = "GPU Shader Caches"
category = "system"
description = "Regenerable graphics caches. The next game launch may recompile shaders."
safety = "Review"

[[targets]]
action = "DeleteContents"
allowed_root = '%LOCALAPPDATA%\D3DSCache'
path = '%LOCALAPPDATA%\D3DSCache'

[[targets]]
action = "DeleteContents"
allowed_root = '%LOCALAPPDATA%\NVIDIA'
path = '%LOCALAPPDATA%\NVIDIA\DXCache'

[[targets]]
action = "DeleteContents"
allowed_root = '%USERPROFILE%\AppData\LocalLow\NVIDIA'
path = '%USERPROFILE%\AppData\LocalLow\NVIDIA\PerDriverVersion\DXCache'

[requirements]
process_closed = "FortniteClient-Win64-Shipping.exe, VALORANT-Win64-Shipping.exe, RobloxPlayerBeta.exe, UnrealEditor.exe"
