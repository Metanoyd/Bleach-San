id = "user_temp"
name = "User Temp Files"
category = "system"
description = "Regular files last modified at least seven days ago in your local Temp folder."
safety = "Safe"

[[targets]]
action = "DeleteContents"
allowed_root = '%LOCALAPPDATA%\Temp'
path = '%LOCALAPPDATA%\Temp'
exclude = ["scoped_dir*","crashpad*","etilqs_*","Singleton*","*.lock","*-lockfile","*.part","*.crdownload"]
