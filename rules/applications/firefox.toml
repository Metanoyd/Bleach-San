id = "firefox"
name = "Firefox Web Cache"
category = "applications"
description = "Cached web assets for installed profiles. Close the browser before cleaning."
safety = "Safe"

[[targets]]
action = "DeleteContents"
allowed_root = '%LOCALAPPDATA%\Mozilla\Firefox\Profiles'
discovery = { type = "profile_cache", base = '%LOCALAPPDATA%\Mozilla\Firefox\Profiles', leaf = 'cache2', chromium = false }

[requirements]
process_closed = "firefox.exe"
