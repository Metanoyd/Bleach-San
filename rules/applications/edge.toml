id = "edge"
name = "Edge Web Cache"
category = "applications"
description = "Cached web assets for installed profiles. Close the browser before cleaning."
safety = "Safe"

[[targets]]
action = "DeleteContents"
allowed_root = '%LOCALAPPDATA%\Microsoft\Edge\User Data'
discovery = { type = "profile_cache", base = '%LOCALAPPDATA%\Microsoft\Edge\User Data', leaf = 'Cache\Cache_Data', chromium = true }

[requirements]
process_closed = "msedge.exe"
