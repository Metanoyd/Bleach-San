id = "brave"
name = "Brave Web Cache"
category = "applications"
description = "Cached web assets for installed profiles. Close the browser before cleaning."
safety = "Safe"

[[targets]]
action = "DeleteContents"
allowed_root = '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data'
discovery = { type = "profile_cache", base = '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data', leaf = 'Cache\Cache_Data', chromium = true }

[requirements]
process_closed = "brave.exe"
